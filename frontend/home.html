<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusBus Live - Find Bus</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body data-page="home">
  <main class="container wide">
    <header class="topbar">
      <p id="welcome" class="welcome"></p>
      <button type="button" id="logoutButton" class="secondary">Logout</button>
    </header>

    <form id="findForm" class="card">
      <h2>Find a bus</h2>

      <label for="fromStop">Current stop</label>
      <select id="fromStop" required>
        <option value="">Loading stops...</option>
      </select>

      <label for="toStop">Destination</label>
      <select id="toStop" required>
        <option value="">Loading stops...</option>
      </select>

      <button type="submit" id="findButton" disabled>Find Bus</button>
    </form>

    <section id="result" class="card result" aria-live="polite" hidden></section>

    <section id="mapCard" class="card" hidden>
      <h2>Live bus map</h2>
      <div id="map"></div>
      <p id="mapInfo" class="map-info"></p>
    </section>

    <p class="note">Prototype: bus location and occupancy are simulated (mock data in SQLite).</p>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="api.js"></script>
  <script src="app.js"></script>
</body>
</html>
